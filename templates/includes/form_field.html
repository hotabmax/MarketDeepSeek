{% if field.field.widget.input_type == "checkbox" %}
    <div class="field field--checkbox{% if field.errors %} field--error{% endif %}">
        <label class="checkbox">
            {{ field }}
            <span>{{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true">*</span>{% endif %}</span>
        </label>
        {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
    </div>
{% else %}
    <div class="field{% if field.errors %} field--error{% endif %}">
        <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<p class="field__hint">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
    </div>
{% endif %}
